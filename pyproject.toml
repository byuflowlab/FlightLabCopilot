[project]
name = "flightlabcopilot"
version = "0.1.0"
description = "Local web app that tells an RC copilot which way to fly to reach GPS waypoints."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "pyserial>=3.5",
]

[project.optional-dependencies]
# Exact versions of every library for the student launchers, which install
# flightlabcopilot[pinned]. See student_setup/README.md.
pinned = [
    # BEGIN PINS (generated by student_setup/update_pins.py; do not edit by hand)
    "blinker==1.9.0",  # via flask
    "click==8.5.1",  # via flask
    "flask==3.1.3",  # via flightlabcopilot (pyproject.toml)
    "itsdangerous==2.2.0",  # via flask
    "jinja2==3.1.6",  # via flask
    "markupsafe==3.0.4",  # via flask, jinja2, werkzeug
    "pyserial==3.5",  # via flightlabcopilot (pyproject.toml)
    "werkzeug==3.1.9",  # via flask
    # END PINS
]

[project.scripts]
flightlabcopilot = "flightlabcopilot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flightlabcopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
